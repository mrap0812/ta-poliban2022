# Jalankan: cp .env.example .env && docker compose up -d  → http://localhost:8080
services:
  app:
    build: { context: ., dockerfile: docker/Dockerfile }
    ports: ["${APP_PORT:-8080}:80"]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ta_kmeans}
      DB_USER: ${DB_USER:-spk}
      DB_PASS: ${DB_PASS:?isi DB_PASS di .env}
    depends_on:
      db: { condition: service_healthy }
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ta_kmeans}
      MARIADB_USER: ${DB_USER:-spk}
      MARIADB_PASSWORD: ${DB_PASS:?isi DB_PASS di .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?isi DB_ROOT_PASS di .env}
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
volumes:
  dbdata:
